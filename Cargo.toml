[package]
name = "hush"
version = "0.1.0"
edition = "2021"
description = "E2EE voice / screen / text rooms. Signaling relay only, the server never sees plaintext."

[dependencies]
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
rustls-acme = { version = "0.15", default-features = false, features = ["ring", "tls12", "webpki-roots", "axum"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
tokio-stream = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde_json = "1"
rand = "0.8"
hmac = "0.12"
sha1 = "0.10"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
